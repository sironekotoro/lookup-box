<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LookupBox icon</title>
  <desc id="desc">A white magnifying glass over a blue rounded square with three list lines inside the lens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a7ff"/>
      <stop offset="0.48" stop-color="#126fe5"/>
      <stop offset="1" stop-color="#0640bb"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b5fcf"/>
      <stop offset="1" stop-color="#084db8"/>
    </linearGradient>
  </defs>
  <rect x="22" y="22" width="468" height="468" rx="98" fill="url(#bg)" stroke="#20a3ff" stroke-width="6"/>
  <line x1="322" y1="321" x2="412" y2="411" stroke="#fff" stroke-width="46" stroke-linecap="round"/>
  <circle cx="226" cy="222" r="137" fill="url(#lens)" stroke="#fff" stroke-width="34"/>
  <rect x="161" y="171" width="130" height="26" rx="13" fill="#16dfc2"/>
  <rect x="161" y="218" width="130" height="25" rx="12.5" fill="#d9e9fa"/>
  <rect x="161" y="264" width="120" height="25" rx="12.5" fill="#d9e9fa"/>
</svg>
