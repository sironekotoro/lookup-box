name: Build browser extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WXT_GOOGLE_CHROME_CLIENT_ID: ${{ vars.WXT_GOOGLE_CHROME_CLIENT_ID }}
      WXT_GOOGLE_FIREFOX_CLIENT_ID: ${{ vars.WXT_GOOGLE_FIREFOX_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install pinned cccc v1.6.0
        uses: moznion/cccc-action@4df3f72f581c87d0792ca89ef401c4ec8e85788b # v1.1.0
        with:
          version: v1.6.0

      - name: Report TypeScript complexity
        run: npm run complexity

      - name: Build Chrome package
        run: npm run zip:chrome

      - name: Build Firefox package
        run: npm run zip:firefox

      - name: Verify configured Chrome OAuth ZIP
        if: env.WXT_GOOGLE_CHROME_CLIENT_ID != ''
        run: npm run verify:chrome-zip

      - name: Verify OAuth-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_version="$(sed -n "s/^const EXTENSION_VERSION = '\([^']*\)';$/\1/p" wxt.config.ts)"
          if [[ -z "$expected_version" ]]; then
            echo "Could not read EXTENSION_VERSION from wxt.config.ts"
            exit 1
          fi

          zips=(.output/*chrome*.zip .output/*firefox*.zip)
          if [[ ${#zips[@]} -lt 2 ]]; then
            echo "Expected Chrome and Firefox package ZIPs."
            exit 1
          fi

          for zip in "${zips[@]}"; do
            if [[ "$zip" != *"-$expected_version-"* ]]; then
              echo "Artifact filename does not include extension version $expected_version: $zip"
              exit 1
            fi

            tmp="$(mktemp -d)"
            unzip -q "$zip" -d "$tmp"
            test -f "$tmp/manifest.json"

            for size in 16 32 48 128; do
              if [[ ! -f "$tmp/icons/icon${size}.png" ]]; then
                echo "Missing icon${size}.png in $zip"
                exit 1
              fi
            done

            node -e '
              const fs = require("fs");
              const [manifestPath, expected] = process.argv.slice(1);
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              if (manifest.version !== expected) {
                console.error(`Expected manifest version ${expected}, got ${manifest.version}`);
                process.exit(1);
              }
              for (const size of ["16", "32", "48", "128"]) {
                if (manifest.icons?.[size] !== `icons/icon${size}.png`) {
                  console.error(`Manifest icon ${size} is missing or incorrect`);
                  process.exit(1);
                }
              }
              const toolbarIcon = manifest.action?.default_icon ?? manifest.browser_action?.default_icon;
              const toolbarValues = typeof toolbarIcon === "string"
                ? [toolbarIcon]
                : Object.values(toolbarIcon ?? {});
              if (!toolbarValues.some((value) => /^\/?icons\/icon(?:16|32|48|128)\.png$/.test(String(value)))) {
                console.error("Toolbar icon is missing or incorrect");
                console.error(JSON.stringify(manifest.action ?? manifest.browser_action ?? null));
                process.exit(1);
              }
            ' "$tmp/manifest.json" "$expected_version"

            if grep -Eq 'script\.google\.com|script\.googleusercontent\.com' "$tmp/manifest.json"; then
              echo "Forbidden gateway host permission found in $zip"
              cat "$tmp/manifest.json"
              exit 1
            fi

            if grep -RInaE 'script\.google\.com|script\.googleusercontent\.com|GAS Web App URL|API Token' "$tmp"; then
              echo "Forbidden legacy gateway runtime string found in $zip"
              exit 1
            fi

            rm -rf "$tmp"
          done

      - name: Show artifacts
        run: find .output -maxdepth 2 -type f -print

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v6
        with:
          name: lookup-box-chrome
          path: .output/*chrome*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v6
        with:
          name: lookup-box-firefox
          path: .output/*firefox*.zip
          if-no-files-found: error
          include-hidden-files: true
