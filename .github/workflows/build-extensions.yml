name: Build browser extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WXT_GOOGLE_CHROME_CLIENT_ID: ${{ vars.WXT_GOOGLE_CHROME_CLIENT_ID }}
      WXT_GOOGLE_FIREFOX_CLIENT_ID: ${{ vars.WXT_GOOGLE_FIREFOX_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Chrome package
        run: npm run zip:chrome

      - name: Build Firefox package
        run: npm run zip:firefox

      - name: Verify OAuth-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(.output/*chrome*.zip .output/*firefox*.zip)
          if [[ ${#zips[@]} -lt 2 ]]; then
            echo "Expected Chrome and Firefox package ZIPs."
            exit 1
          fi

          for zip in "${zips[@]}"; do
            tmp="$(mktemp -d)"
            unzip -q "$zip" -d "$tmp"
            test -f "$tmp/manifest.json"

            if grep -Eq 'script\.google\.com|script\.googleusercontent\.com' "$tmp/manifest.json"; then
              echo "Forbidden gateway host permission found in $zip"
              cat "$tmp/manifest.json"
              exit 1
            fi

            if grep -RInaE 'script\.google\.com|script\.googleusercontent\.com|GAS Web App URL|API Token' "$tmp"; then
              echo "Forbidden legacy gateway runtime string found in $zip"
              exit 1
            fi

            rm -rf "$tmp"
          done

      - name: Show artifacts
        run: find .output -maxdepth 2 -type f -print

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: lookup-box-chrome
          path: .output/*chrome*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: lookup-box-firefox
          path: .output/*firefox*.zip
          if-no-files-found: error
          include-hidden-files: true
